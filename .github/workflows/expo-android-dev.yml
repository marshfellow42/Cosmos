name: Expo Android Preview Build

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  Build-and-Release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21.0.6'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo environment
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest

      - name: Write google-services.json from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Show current working directory
        run: pwd

      - name: List root directory contents
        run: ls -la

      - name: List android directory contents
        run: ls -la android

      - name: List android/app directory contents
        run: ls -la android/app

      - name: Show google-services.json contents (first 30 lines)
        run: head -n 30 android/app/google-services.json || echo "google-services.json not found or empty"

      - name: Check if google-services.json is valid JSON
        run: |
          if [ -f android/app/google-services.json ]; then
            jq . android/app/google-services.json > /dev/null && echo "Valid JSON" || echo "Invalid JSON"
          else
            echo "google-services.json file does not exist"
          fi
        shell: bash

      - name: Prebuild project
        run: npx expo prebuild --no-install --platform android

      - name: Build APK locally
        run: eas build --platform android --profile preview --local --non-interactive --output app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get next tag
        id: tag
        run: |
          latest_tag=$(gh release list --limit 100 | grep '^r[0-9]' | awk '{print $1}' | sort -Vr | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            next_tag="r1"
          else
            number=${latest_tag#r}
            next_tag="r$((number + 1))"
          fi
          echo "tag=$next_tag" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APK
        id: rename
        run: |
          new_filename="cosmos-${{ steps.tag.outputs.tag }}.apk"
          mv app-release.apk "$new_filename"
          echo "apk=$new_filename" >> $GITHUB_OUTPUT

      - name: Get commit message and SHA
        id: commit
        run: |
          full_message=$(git log -1 --pretty=%B)
          clean_message=$(echo "$full_message" | sed '/^Merge pull request/d' | sed '/^$/d' | head -n 1)
          sha=$(git rev-parse HEAD)
          url="https://github.com/${{ github.repository }}/commit/$sha"

          {
            echo "message<<EOF"
            echo "$clean_message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "sha=$sha" >> $GITHUB_OUTPUT
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Create GitHub pre-release with renamed APK
        run: |
          notes="- [${{ steps.commit.outputs.message }}](${{ steps.commit.outputs.url }})"
          gh release create ${{ steps.tag.outputs.tag }} \
            --target ${{ steps.commit.outputs.sha }} \
            --prerelease \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "$notes" \
            "${{ steps.rename.outputs.apk }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
